<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шиномонтаж - У Рафаэля</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            padding: 35px;
            border-radius: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(250, 204, 21, 0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 {
            color: #facc15;
            text-align: center;
            font-size: 32px;
            margin-bottom: 5px;
        }
        .sub {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 16px;
        }
        input, textarea {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 16px;
            transition: 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #facc15;
            outline: none;
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.1);
        }
        textarea {
            min-height: 70px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 16px;
            background: #facc15;
            color: #0f172a;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover {
            background: #fde047;
            transform: scale(1.01);
            box-shadow: 0 4px 20px rgba(250, 204, 21, 0.3);
        }
        .label {
            color: #94a3b8;
            font-size: 14px;
            margin: 15px 0 5px;
            display: block;
        }
        .date-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin: 8px 0;
        }
        .date-option {
            padding: 10px 4px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        .date-option:hover:not(.fully-booked) {
            border-color: #64748b;
            background: #2d3a4f;
        }
        .date-option.selected {
            background: #facc15;
            color: #0f172a;
            border-color: #facc15;
            font-weight: 700;
        }
        .date-option.fully-booked {
            background: rgba(220, 38, 38, 0.2);
            border-color: #dc2626;
            color: #fca5a5;
            cursor: not-allowed;
        }
        .time-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 10px 0;
        }
        .time-option {
            padding: 12px 4px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
            position: relative;
        }
        .time-option:hover:not(.booked) {
            border-color: #64748b;
            background: #2d3a4f;
        }
        .time-option.selected {
            background: #facc15;
            color: #0f172a;
            border-color: #facc15;
            font-weight: 700;
        }
        .time-option.booked {
            background: rgba(220, 38, 38, 0.2);
            border-color: #dc2626;
            color: #fca5a5;
            cursor: not-allowed;
        }
        .time-option.booked::before {
            content: "ЗАНЯТО";
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            background: #dc2626;
            color: white;
            font-size: 8px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .toast {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0f172a;
            border: 2px solid #4ade80;
            padding: 40px 50px;
            border-radius: 24px;
            text-align: center;
            z-index: 999;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            max-width: 90%;
        }
        .toast.show {
            display: block;
        }
        .toast-icon {
            font-size: 56px;
        }
        .toast-title {
            color: #4ade80;
            font-size: 24px;
            font-weight: 700;
            margin: 12px 0 8px;
        }
        .toast-text {
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .toast-close {
            background: rgba(255,255,255,0.08);
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 8px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .toast-close:hover {
            background: rgba(255,255,255,0.15);
        }
        @media (max-width: 500px) {
            .container { padding: 20px; }
            .date-grid { grid-template-columns: repeat(7, 1fr); gap: 4px; }
            .date-option { padding: 8px 2px; font-size: 13px; }
            .time-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚡ У Рафаэля</h1>
    <p class="sub">Шиномонтаж в Затоне</p>

    <form action="https://script.google.com/macros/s/AKfycbxMuCALL5FXoSBSGZj--94-FWJbHrrxX85erwslDx3Cf9ud3NTXyUvAGKGd5V3LqZuz/exec" method="POST" id="bookingForm">
        <input type="text" name="Имя" placeholder="Ваше имя" required>
        <input type="tel" name="Телефон" placeholder="+7 (___) ___-__-__" required>
        <input type="text" name="Автомобиль" placeholder="Марка и модель" required>
        <textarea name="Описание" placeholder="Что нужно сделать?"></textarea>

        <span class="label">📅 День</span>
        <div class="date-grid" id="dayGrid"></div>

        <span class="label">📅 Месяц</span>
        <div class="date-grid" id="monthGrid"></div>

        <input type="hidden" name="День" id="selectedDay" required>
        <input type="hidden" name="Месяц" id="selectedMonth" required>

        <span class="label">🕐 Время</span>
        <div class="time-grid" id="timeGrid"></div>
        <input type="hidden" name="Время" id="selectedTime" required>

        <input type="hidden" name="_redirect" value="https://islam1280.github.io/Rafael_site/?success=true">
        <button type="submit">✅ Записаться</button>
    </form>
</div>

<div id="toast" class="toast">
    <div class="toast-icon">✅</div>
    <div class="toast-title">Вы успешно записались!</div>
    <div class="toast-text">Мы свяжемся с вами в ближайшее время.</div>
    <button class="toast-close" onclick="closeToast()">✕ Закрыть</button>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxMuCALL5FXoSBSGZj--94-FWJbHrrxX85erwslDx3Cf9ud3NTXyUvAGKGd5V3LqZuz/exec';
    let bookedSlots = [];

    async function loadBookedSlots() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            if (data.success) {
                bookedSlots = data.bookedSlots || [];
                console.log('Загружено занятых слотов:', bookedSlots.length);
            } else {
                console.error('Ошибка загрузки:', data.error);
            }
        } catch (error) {
            console.error('Ошибка соединения:', error);
        }
    }

    function showToast() {
        document.getElementById('toast').classList.add('show');
        setTimeout(() => {
            document.getElementById('toast').classList.remove('show');
        }, 5000);
    }

    function closeToast() {
        document.getElementById('toast').classList.remove('show');
    }

    document.addEventListener('DOMContentLoaded', async function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('success') === 'true') {
            window.history.replaceState(null, null, window.location.pathname);
            showToast();
        }

        await loadBookedSlots();

        const dayGrid = document.getElementById('dayGrid');
        const monthGrid = document.getElementById('monthGrid');
        const timeGrid = document.getElementById('timeGrid');
        const selectedDay = document.getElementById('selectedDay');
        const selectedMonth = document.getElementById('selectedMonth');
        const selectedTime = document.getElementById('selectedTime');

        let currentDay = null;
        let currentMonth = null;

        const months = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];

        for (let d = 1; d <= 31; d++) {
            const div = document.createElement('div');
            div.className = 'date-option';
            div.textContent = d;
            div.dataset.day = d;
            div.addEventListener('click', function() {
                if (this.classList.contains('fully-booked')) return;
                document.querySelectorAll('#dayGrid .date-option').forEach(el => el.classList.remove('selected'));
                this.classList.add('selected');
                currentDay = this.dataset.day;
                selectedDay.value = currentDay;
                updateTimeSlots();
            });
            dayGrid.appendChild(div);
        }

        months.forEach(month => {
            const div = document.createElement('div');
            div.className = 'date-option';
            div.textContent = month;
            div.dataset.month = month;
            div.addEventListener('click', function() {
                document.querySelectorAll('#monthGrid .date-option').forEach(el => el.classList.remove('selected'));
                this.classList.add('selected');
                currentMonth = this.dataset.month;
                selectedMonth.value = currentMonth;
                updateTimeSlots();
            });
            monthGrid.appendChild(div);
        });

        const times = [];
        for (let h = 8; h <= 20; h++) {
            for (let m = 0; m < 60; m += 30) {
                if (h === 20 && m === 30) continue;
                const hh = String(h).padStart(2, '0');
                const mm = String(m).padStart(2, '0');
                times.push(`${hh}:${mm}`);
            }
        }

        function updateTimeSlots() {
            timeGrid.innerHTML = '';

            if (!currentDay || !currentMonth) {
                times.forEach(time => {
                    const div = document.createElement('div');
                    div.className = 'time-option';
                    div.textContent = time;
                    div.style.opacity = '0.3';
                    div.style.cursor = 'default';
                    timeGrid.appendChild(div);
                });
                return;
            }

            let bookedCount = 0;
            const totalSlots = times.length;

            times.forEach(time => {
                const div = document.createElement('div');
                div.className = 'time-option';
                div.textContent = time;

                const slotKey = `${currentDay} ${currentMonth} ${time}`;
                const isBooked = bookedSlots.includes(slotKey);

                if (isBooked) {
                    div.classList.add('booked');
                    bookedCount++;
                }

                div.addEventListener('click', function() {
                    if (this.classList.contains('booked')) return;
                    document.querySelectorAll('#timeGrid .time-option').forEach(el => el.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedTime.value = this.textContent;
                });

                timeGrid.appendChild(div);
            });

            const dayElements = document.querySelectorAll('#dayGrid .date-option');
            dayElements.forEach(el => {
                if (el.dataset.day === currentDay) {
                    if (bookedCount === totalSlots) {
                        el.classList.add('fully-booked');
                        el.classList.remove('selected');
                    } else {
                        el.classList.remove('fully-booked');
                    }
                }
            });
        }

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            const day = selectedDay.value;
            const month = selectedMonth.value;
            const time = selectedTime.value;

            if (!day || !month || !time) {
                e.preventDefault();
                alert('⚠️ Пожалуйста, выберите ДЕНЬ, МЕСЯЦ и ВРЕМЯ!');
                return;
            }

            const slotKey = `${day} ${month} ${time}`;
            if (!bookedSlots.includes(slotKey)) {
                bookedSlots.push(slotKey);
            }
        });
    });
</script>
</body>
</html>
