<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шиномонтаж - У Рафаэля</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0f172a;color:#e2e8f0;padding:20px}
.container{max-width:600px;margin:0 auto;background:rgba(30,41,59,0.7);padding:30px;border-radius:20px}
h1{color:#facc15;margin-bottom:5px;text-align:center}
.sub{text-align:center;color:#94a3b8;margin-bottom:20px}
input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #334155;background:#1e293b;color:white;font-size:16px}
textarea{min-height:60px}
button{width:100%;padding:15px;background:#facc15;color:#0f172a;font-weight:700;border:none;border-radius:10px;font-size:18px;cursor:pointer;margin-top:10px}
.time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.time-option{padding:10px;background:#1e293b;border:2px solid #334155;border-radius:10px;text-align:center;cursor:pointer;position:relative}
.time-option.booked{background:rgba(220,38,38,0.3);border-color:#dc2626;cursor:not-allowed}
.time-option.booked::before{content:"ЗАНЯТО";position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#dc2626;color:white;font-size:8px;padding:1px 8px;border-radius:10px;white-space:nowrap}
.time-option.selected{background:#facc15;color:#0f172a;border-color:#facc15}
.date-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.date-option{padding:8px;background:#1e293b;border:2px solid #334155;border-radius:8px;text-align:center;cursor:pointer}
.date-option.selected{background:#facc15;color:#0f172a;border-color:#facc15}
.date-option.fully-booked{background:rgba(220,38,38,0.3);border-color:#dc2626;cursor:not-allowed}
.toast{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#0f172a;border:2px solid #4ade80;padding:40px;border-radius:20px;text-align:center;z-index:999;box-shadow:0 0 50px rgba(0,0,0,0.8);max-width:90%}
.toast.show{display:block}
.toast-icon{font-size:56px}
.toast-title{color:#4ade80;font-size:24px;font-weight:700;margin:10px 0}
.toast-close{background:rgba(255,255,255,0.1);border:1px solid #334155;color:#e2e8f0;padding:8px 30px;border-radius:30px;cursor:pointer;margin-top:10px}
</style>
</head>
<body>

<div class="container">
    <h1>⚡ У Рафаэля</h1>
    <p class="sub">Шиномонтаж в Затоне</p>

    <!-- ===== ФОРМА ===== -->
    <form action="https://script.google.com/macros/s/AKfycbxMuCALL5FXoSBSGZj--94-FWJbHrrxX85erwslDx3Cf9ud3NTXyUvAGKGd5V3LqZuz/exec" method="POST" id="bookingForm">

        <input type="text" name="Имя" placeholder="Ваше имя" required>
        <input type="tel" name="Телефон" placeholder="+7 (___) ___-__-__" required>
        <input type="text" name="Автомобиль" placeholder="Марка и модель" required>
        <textarea name="Описание" placeholder="Что нужно сделать?"></textarea>

        <div style="margin:15px 0 5px;color:#94a3b8;font-size:14px;">📅 День</div>
        <div class="date-grid" id="dayGrid"></div>

        <div style="margin:15px 0 5px;color:#94a3b8;font-size:14px;">📅 Месяц</div>
        <div class="date-grid" id="monthGrid"></div>

        <input type="hidden" name="День" id="selectedDay" required>
        <input type="hidden" name="Месяц" id="selectedMonth" required>

        <div style="margin:15px 0 5px;color:#94a3b8;font-size:14px;">🕐 Время</div>
        <div class="time-grid" id="timeGrid"></div>
        <input type="hidden" name="Время" id="selectedTime" required>

        <input type="hidden" name="_redirect" value="https://islam1280.github.io/Rafael_site/?success=true">
        <button type="submit">✅ Записаться</button>
    </form>
</div>

<!-- ===== ВСПЛЫВАЮЩЕЕ УВЕДОМЛЕНИЕ ===== -->
<div id="toast" class="toast">
    <div class="toast-icon">✅</div>
    <div class="toast-title">Вы успешно записались!</div>
    <p style="color:#94a3b8;margin-bottom:10px;">Мы свяжемся с вами в ближайшее время.</p>
    <button class="toast-close" onclick="closeToast()">✕ Закрыть</button>
</div>

<script>
// ===== ВАШ URL СКРИПТА =====
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxMuCALL5FXoSBSGZj--94-FWJbHrrxX85erwslDx3Cf9ud3NTXyUvAGKGd5V3LqZuz/exec';
let bookedSlots = [];

// ===== ЗАГРУЗКА ЗАНЯТЫХ СЛОТОВ =====
async function loadBookedSlots() {
    try {
        const r = await fetch(SCRIPT_URL);
        const d = await r.json();
        if (d.success) bookedSlots = d.bookedSlots || [];
    } catch(e) { console.error(e); }
}

// ===== УВЕДОМЛЕНИЕ =====
function showToast() {
    document.getElementById('toast').classList.add('show');
    setTimeout(() => document.getElementById('toast').classList.remove('show'), 5000);
}
function closeToast() {
    document.getElementById('toast').classList.remove('show');
}

// ===== ОСНОВНАЯ ЛОГИКА =====
document.addEventListener('DOMContentLoaded', async function() {
    // Показываем уведомление, если запись успешна
    if (new URLSearchParams(location.search).get('success') === 'true') {
        history.replaceState(null, '', location.pathname);
        showToast();
    }

    // Загружаем занятые слоты
    await loadBookedSlots();

    const dayGrid = document.getElementById('dayGrid');
    const monthGrid = document.getElementById('monthGrid');
    const timeGrid = document.getElementById('timeGrid');
    const selectedDay = document.getElementById('selectedDay');
    const selectedMonth = document.getElementById('selectedMonth');
    const selectedTime = document.getElementById('selectedTime');
    let currentDay = null, currentMonth = null;

    const months = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];

    // ===== ГЕНЕРАЦИЯ ДНЕЙ =====
    for (let d = 1; d <= 31; d++) {
        const div = document.createElement('div');
        div.className = 'date-option';
        div.textContent = d;
        div.dataset.day = d;
        div.onclick = function() {
            if (this.classList.contains('fully-booked')) return;
            document.querySelectorAll('#dayGrid .date-option').forEach(el => el.classList.remove('selected'));
            this.classList.add('selected');
            currentDay = this.dataset.day;
            selectedDay.value = currentDay;
            updateTimeSlots();
        };
        dayGrid.appendChild(div);
    }

    // ===== ГЕНЕРАЦИЯ МЕСЯЦЕВ =====
    months.forEach(m => {
        const div = document.createElement('div');
        div.className = 'date-option';
        div.textContent = m;
        div.dataset.month = m;
        div.onclick = function() {
            document.querySelectorAll('#monthGrid .date-option').forEach(el => el.classList.remove('selected'));
            this.classList.add('selected');
            currentMonth = this.dataset.month;
            selectedMonth.value = currentMonth;
            updateTimeSlots();
        };
        monthGrid.appendChild(div);
    });

    // ===== ВСЕ СЛОТЫ ВРЕМЕНИ =====
    const times = [];
    for (let h = 8; h <= 20; h++) {
        for (let m = 0; m < 60; m += 30) {
            if (h === 20 && m === 30) continue;
            times.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
        }
    }

    // ===== ОБНОВЛЕНИЕ СЛОТОВ ВРЕМЕНИ =====
    function updateTimeSlots() {
        timeGrid.innerHTML = '';
        if (!currentDay || !currentMonth) {
            // Показываем серые слоты, если дата не выбрана
            times.forEach(time => {
                const div = document.createElement('div');
                div.className = 'time-option';
                div.textContent = time;
                div.style.opacity = '0.3';
                div.style.cursor = 'default';
                timeGrid.appendChild(div);
            });
            return;
        }

        let bookedCount = 0;
        const totalSlots = times.length;

        times.forEach(time => {
            const div = document.createElement('div');
            div.className = 'time-option';
            div.textContent = time;

            const key = `${currentDay} ${currentMonth} ${time}`;
            const isBooked = bookedSlots.includes(key);

            if (isBooked) {
                div.classList.add('booked');
                bookedCount++;
            }

            div.onclick = function() {
                if (this.classList.contains('booked')) return;
                document.querySelectorAll('#timeGrid .time-option').forEach(el => el.classList.remove('selected'));
                this.classList.add('selected');
                selectedTime.value = this.textContent;
            };

            timeGrid.appendChild(div);
        });

        // Если все слоты заняты — день становится красным
        document.querySelectorAll('#dayGrid .date-option').forEach(el => {
            if (el.dataset.day === currentDay) {
                if (bookedCount === totalSlots) {
                    el.classList.add('fully-booked');
                    el.classList.remove('selected');
                } else {
                    el.classList.remove('fully-booked');
                }
            }
        });
    }

    // ===== ОТПРАВКА ФОРМЫ =====
    document.getElementById('bookingForm').onsubmit = function(e) {
        if (!selectedDay.value || !selectedMonth.value || !selectedTime.value) {
            e.preventDefault();
            alert('⚠️ Пожалуйста, выберите ДЕНЬ, МЕСЯЦ и ВРЕМЯ!');
        }
    };
});
</script>

</body>
</html>
